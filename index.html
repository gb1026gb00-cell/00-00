function contextFor(){
 if(s.mode!=='play')return null;
 const woo=s.role==='woo',ch=s.chapter,step=s.step,k=`${ch}:${step}`;
 const map=woo?{
  '1:2':'mixed','2:0':'present','2:1':'present','2:2':'present','3:0':'memory','3:1':'memory','3:2':'conditional_woo3','3:3':'present',
  '4:0':'present','4:1':'phone','4:2':'present','4:3':'connection',
  '5:2':'conditional_woo5','6:0':'present','6:1':'present','6:2':'conditional_woo6','6:3':'conditional_woo6last',

 }:{'1:0':'connection','3:2':'conditional_san3','3:3':'memory','4:0':'memoryphone','4:1':'memoryphone','4:2':'connection','4:3':'connection',
 '5:2':'archive','5:3':'archive','6:3':'archive','7:0':'archive','7:1':'phone','7:2':'phone','7:3':'face',
 '8:0':'face','8:1':'face','8:2':'face','8:3':'face'};
 let kind=map[k]||'connection';
 if(kind==='conditional_san3'){const a=get('3-S01',2);kind=a===0?'memoryface':a===1?'memoryphone':'memory'}
 if(kind==='conditional_woo3'){const a=get('3-W01',2);kind=a===0?'face':a===1?'present':'memory'}
 if(kind==='conditional_woo5')kind=get('5-W01',2)===2?'memory':'present';
 if(kind==='conditional_woo6')kind=get('6-W01',2)===0?'phone':get('6-W01',2)===1?'present':'memory';
 if(kind==='conditional_woo6last')kind=get('6-W01',2)===2?'archive':'memory';
 let date=woo?dateByChap[ch]:ch>=7?'2023.11.26':dateByChap[ch];
 if(!woo&&['memory','memoryface','memoryphone','archive'].includes(kind))date=kind==='archive'&&ch===7?'2023.11.26':dateByChap[ch];
 if(woo&&ch===3&&step===0)date='2019.07.10 → 2020.09.12';
 const labels={connection:'◉ 시간 연결 · 과거/미래',present:'▣ 현재 시점 · 문자',face:'◇ 현재 시점 · 대면',phone:'▣ 현재 시점 · 전화 통화',memory:'▤ 과거 기록 · 회상',memoryface:'▤ 과거 기록 · 대면 회상',memoryphone:'▤ 과거 기록 · 전화 통화',archive:'▤ 자료 열람 · 기록 확인',mixed:'▣ 현재 문자 / 시간 연결'};
 return {kind,date,label:labels[kind]};
}

let toastQueue=[];

function clueGet(...ids){let fresh=[];for(const id of ids){if(!s.runClues.includes(id))s.runClues.push(id);if(!s.clues.includes(id)){s.clues.push(id);s.unreadClues.push(id);fresh.push(id)}}save();updateArchiveDot();if(fresh.length){toastQueue.push(...fresh);queueMicrotask(showClueToast)}}
function showClueToast(){const box=$('clueToast');if(!box||!toastQueue.length||!$('sheet').classList.contains('hide'))return;const id=toastQueue.shift();if(!s.unreadClues.includes(id)){showClueToast();return}const found=clueFor(id);if(!found)return;box.innerHTML=`<b>새로운 기록이 발견되었습니다.</b><br>${esc(found[2])} <sup>${found[1]||'P'}</sup><br><button type="button" onclick="openClueDetail('${id}')">기록 확인하기</button><button type="button" onclick="dismissClueToast()">나중에</button>`;box.classList.remove('hide')}

const criticalByChoice={'5-S01':['article','time1642'],'6-S01':['article','time1642','map'],'4-W01':['w_deleted','w_cancel'],'6-W01':['w_unsentletter','w_reappeared']};
function criticalReminder(id){
 const relevant=criticalByChoice[id]||[];
 const ids=relevant.filter(c=>s.runClues.includes(c)&&s.unreadClues.includes(c));
 if(!ids.length||s.clueNoticeSeen[id])return false;
 s.clueNoticeSeen[id]=true;save();
 const names=ids.map(c=>clueFor(c)?.[2]).filter(Boolean);
 const warning=`<div class="critical-symbol" aria-hidden="true">!</div><div class="eyebrow">ARCHIVE / IMPORTANT RECORD</div><h2 class="critical-title">중요 기록<br>미확인</h2><p class="critical-lead">아직 확인하지 않은 중요한 단서가 있어.</p><div class="critical-items">${names.map(n=>`<div>● ${esc(n)}</div>`).join('')}</div><p class="sub">지금 내리는 선택은 나중에 되돌릴 수 없어.<br><b>선택하기 전에 기록을 확인해 줘.</b></p><p class="footnote">단서만 확인해도 선택은 확정되지 않아. 원한다면 확인하지 않고 진행할 수도 있어.</p>${btn('📁 중요 기록 확인하기',`openArchive()`,'primary')}${btn('확인하지 않고 계속하기',`closeSheet()`,'ghost')}`;
 sheet(warning);$('sheet').classList.add('critical-sheet');
 return true;
}

function showNotice(){set(`<div class="hero"><div class="eyebrow">RECORD 000 / BEFORE CONNECTION</div><div class="bigtime">00:00</div><h1 class="h1">당신의 선택은 이미 과거입니다.</h1><p class="sub">되돌릴 수 없습니다.<br>한 번 전송된 메시지는 취소할 수 없습니다.<br>그러나 모든 기록이 사라지는 것은 아닙니다.</p></div><div class="card"><div class="eyebrow">PLAY GUIDE</div><p class="sub">산은 우영의 생존을, 우영은 산과의 화해와 고백을 목표로 합니다. 두 시점은 각각 독립적인 시간선입니다. 신뢰·솔직함·유대감·안전도·단서·정체 인식이 선택에 따라 달라집니다. 수치는 표시되지 않습니다.</p><p class="sub">진행 중 선택 취소와 시간선 초기화는 불가합니다. 엔딩 확인 후 다른 시점이나 새로운 시간선을 열 수 있습니다.</p><p class="sub">동일 인물의 새로운 시간선은 왼쪽 위에 N회차로 표시됩니다. 단서에는 최초 발견한 챕터 번호가 붙습니다. 진행은 이 브라우저에 자동 저장됩니다.</p><p class="footnote">총 8개 엔딩 · 교통사고/사망/상실 소재 · 실존 인물의 사생활 및 실제 관계와 무관한 비공식 팬 창작 픽션</p></div>`,btn('자세한 플레이 안내',`openGuide()`)+btn('그럼에도 연결하시겠습니까? → 연결 시작',`acceptNotice()`,'primary'))}

function openGuide(){sheet(`<div class="row"><h2 style="flex:4;margin:0">PLAY GUIDE</h2><button class="iconbtn" onclick="closeSheet()">✕</button></div><p class="sub"><b>선택 요소</b><br>TRUST · 신뢰도<br>HONESTY · 솔직함<br>BOND · 유대감<br>SAFETY · 안전도<br>CLUES · 단서<br>RECOGNITION · 정체 인식</p><p class="sub">정확한 점수와 정답은 공개되지 않습니다. 선택에 따라 대사·안전·관계·엔딩이 달라집니다.</p><p class="sub"><b>되돌리기 금지</b><br>게임 도중 시간선 초기화, 다른 시점 시작, 선택지 취소는 불가능합니다. 페이지를 새로고침하면 저장된 단계에서 이어집니다.</p><p class="sub"><b>회차 / 시점</b><br>산과 우영의 시점은 각각 독립된 시간선입니다. 플레이어는 선택한 인물의 행동만 결정할 수 있으며, 각 루트에서 서로 다른 결말을 맞이할 수 있습니다. 엔딩을 확인한 뒤 같은 인물로 다시 시작하면 해당 인물의 회차가 증가합니다.</p><p class="sub"><b>단서와 엔딩</b><br>보관함에서 기록을 볼 수 있습니다. 이름 옆의 작은 숫자는 발견 챕터입니다. 엔딩·단서는 시간선을 넘겨도 남습니다.</p><p class="sub"><b>저장</b><br>현재 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 캐시를 삭제하면 없어질 수 있습니다.</p><p class="footnote">약 2시간 30분~3시간 목표 · 총 8개 엔딩 · 픽션 / 실제 인물과 관계 없음</p>${btn('닫기',`closeSheet()`,'primary')}`)}

function intro(){const b=`${scene('TIME CONNECTION')}${narration(s.role==='san'?'2023년 11월 26일. 한국행 비행기.\n산을 찾아왔던 동창이 우영의 죽음을 무심코 꺼냈다. ‘내가 아는 정우영이 맞아? 잘못 들은 거겠지.’ 몇 번이나 부정해도 대답은 같았다. 그럴 리가 없잖아. 걔가 죽었을 리가 없잖아.\n산은 창밖도 보지 못한 채 한국에 빨리 도착하기만 바란다. 왜 그때 널 두고 왔을까.':'2020년 7월 10일. 우영은 연락처 목록에서 기억에 없는 이름을 발견한다.\n‘미래’. 대체 언제 저장된 번호일까?')}${s.role==='san'?chat('san','……우영아.')+narration('“자리 좀 바꿔주시겠습니까. 창밖이 보고 싶어서요.”\n산은 멍하게 고개를 끄덕인다. “네…….”\n남자는 산의 표정을 오래 바라본다. 어쩐지 자신이 잃어버린 시간을 보는 듯한 얼굴이다.')+chat('san','이건 뭐예요?')+narration(s.failures>=3?'남자는 휴대폰을 건네며 낮게 말한다. “몇 번째인지 세는 것도 그만뒀어요. 꼭 행복했으면 하네요.”':s.failures>=2?'남자는 휴대폰을 건네며 말한다. “또 보네요. 이번에는 조금 일찍 알아채시길.”':s.failures>=1?'남자는 휴대폰을 건네며 말한다. “우리 다시는 보지 맙시다. 꼭 행복했으면 하네요.”':'남자는 휴대폰을 내민다. “저한테는 더 이상 필요 없거든요. 꼭 행복했으면 하네요.”')+system('00:00 — 알 수 없는 메시지 수신'):system('새 연락처가 발견되었습니다.\n미래')}`;stepView(b)}
function repairPrologueClues(){if(!s.clues.includes('initial'))return;const passed=s.role!=='san'||s.chapter>0||s.step>=3||s.mode==='ending';if(passed&&(!s.clues.includes('futuredate')||!s.clues.includes('undeletable')))clueGet('futuredate','undeletable')}
function render(){repairPrologueClues();if(!s.accepted)return showNotice();if(s.mode==='home')return home();if(s.mode==='ending')return showEnding(s.run.ending??0);if(s.mode!=='play')return home();let c=s.chapter,k=s.step;if(c>8)return resolveEnding();const view=(s.role==='woo'?WOO_STORY:SAN_STORY)[c]?.[k];if(!view){return resolveEnding()}view()}
